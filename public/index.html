<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Park Conservation Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #0f1115; }
    #map { flex: 1; height: 100%; }
    #sidebar { width: 340px; background: #161920; color: #e6e8eb; display: flex; flex-direction: column; border-left: 1px solid #2a2f3a; }
    #sidebar h3 { padding: 16px; margin: 0; background: #1c2028; border-bottom: 1px solid #2a2f3a; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
    #log-container { flex: 1; overflow-y: auto; padding: 12px; }
    .log-entry { background: #1e222b; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 3px solid #4CAF50; font-size: 13px; line-height: 1.4; cursor: pointer; transition: background 0.2s; }
    .log-entry:hover { background: #252a35; }
    .log-entry .meta { color: #8b92a3; font-size: 11px; margin-bottom: 4px; font-family: monospace; }
    .log-entry .coords { color: #66bb6a; font-family: monospace; font-size: 12px; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.4; }
    .custom-icon svg { width: 20px; height: 20px; pointer-events: none; }
    .modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal.hidden { display: none; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(3px); }
    .modal-content { position: relative; background: #161920; color: #e6e8eb; padding: 24px; border-radius: 12px; width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto; border: 1px solid #2a2f3a; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .close-modal { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #8b92a3; font-size: 26px; cursor: pointer; line-height: 1; }
    .close-modal:hover { color: #e6e8eb; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .detail-item { background: #1e222b; padding: 10px; border-radius: 6px; }
    .detail-item.full-width { grid-column: span 2; }
    .label { color: #8b92a3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
    .track-section { margin-top: 16px; border-top: 1px solid #2a2f3a; padding-top: 12px; }
    #modal-track-list { list-style: none; padding: 0; max-height: 220px; overflow-y: auto; }
    #modal-track-list li { padding: 8px 0; border-bottom: 1px solid #2a2f3a; font-size: 12px; font-family: monospace; color: #a0aab5; }
    #modal-track-list li:last-child { border-bottom: none; color: #66bb6a; font-weight: 500; }
    .focus-btn { margin-top: 16px; width: 100%; padding: 10px; background: #4CAF50; color: #0f1115; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .focus-btn:hover { background: #43a047; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <h3>🛰️ Detection Logs</h3>
    <div id="log-container"></div>
  </div>
  <div id="detection-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="close-modal" aria-label="Close">&times;</button>
      <h2 id="modal-title" style="margin:0 0 8px; font-size:18px;">Detection Details</h2>
      <div class="modal-grid">
        <div class="detail-item"><span class="label">ID</span> <span id="modal-id"></span></div>
        <div class="detail-item"><span class="label">Name</span> <span id="modal-name"></span></div>
        <div class="detail-item"><span class="label">Type</span> <span id="modal-type"></span></div>
        <div class="detail-item"><span class="label">Status</span> <span id="modal-status"></span></div>
        <div class="detail-item full-width"><span class="label">Coordinates</span> <span id="modal-coords"></span></div>
      </div>
      <div class="track-section">
        <h3 style="font-size:14px; margin:0 0 8px;">📍 Movement History</h3>
        <ul id="modal-track-list"></ul>
      </div>
      <button class="focus-btn" id="focus-map-btn">📍 Focus on Map</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
